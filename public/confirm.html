<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirming Subscription - UnsaidSignals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a202c;
            padding: 20px;
        }
        
        .processing-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #0066CC;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #0066CC;
        }
    </style>
    <script>
        // Process confirmation
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const brand = urlParams.get('brand') || 'unsaidsignals';
            
            if (token) {
                // Redirect to Mautic confirm endpoint
                window.location.replace(`https://mail.principal.house/api/confirm.php?token=${token}&brand=${brand}`);
            } else {
                document.body.innerHTML = `
                    <div class="processing-container">
                        <h1 style="color: #dc2626;">Invalid Confirmation Link</h1>
                        <p style="color: #6b7280; line-height: 1.6;">
                            This confirmation link appears to be invalid or expired. 
                            Please check your email for the latest confirmation link or sign up again.
                        </p>
                        <a href="https://unsaidsignals.com" style="display: inline-block; margin-top: 24px; color: #0066CC; text-decoration: none; font-weight: 500;">
                            Return to Homepage
                        </a>
                    </div>
                `;
            }
        };
    </script>
</head>
<body>
    <div class="processing-container">
        <div class="spinner"></div>
        <h1>Confirming Your Subscription</h1>
        <p style="color: #6b7280;">Please wait while we confirm your email address...</p>
    </div>
</body>
</html>
